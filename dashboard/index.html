<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rum — OSA Digital Twin: Clinician Dashboard (Concept)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #f5f3fb;
    --panel: #ffffff;
    --panel2: #f1edfa;
    --border: #e1d9f5;
    --text: #241a42;
    --muted: #716a8c;
    --purple: #3d1a78;
    --purple-dark: #2b1559;
    --gold: #f0b429;
    --low: #3d1a78;
    --mod: #f0b429;
    --high: #d6305c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, Segoe UI, Arial, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    padding: 16px 24px;
    background: linear-gradient(90deg, var(--purple-dark), var(--purple));
    border-bottom: 3px solid var(--gold);
  }
  header h1 {
    margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700;
    font-size: 18px; color: #fff; letter-spacing: .01em;
  }
  header p { margin: 4px 0 0; color: #d9cdf5; font-size: 12.5px; }
  .layout { display: flex; height: calc(100vh - 68px); }
  .sidebar { width: 300px; background: var(--panel); border-right: 1px solid var(--border); overflow-y: auto; }
  .patient-card { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .12s; }
  .patient-card:hover { background: var(--panel2); }
  .patient-card.active { background: var(--panel2); border-left: 3px solid var(--purple); }
  .pc-top { display: flex; justify-content: space-between; align-items: center; }
  .pc-id { font-weight: 600; font-size: 13.5px; font-family: 'Poppins', sans-serif; }
  .pc-meta { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 10px; color: #fff; letter-spacing: .02em; }
  .badge.LOW { background: var(--low); }
  .badge.MODERATE { background: var(--mod); color: #2b1559; }
  .badge.HIGH { background: var(--high); }
  .main { flex: 1; padding: 22px 28px; overflow-y: auto; }
  .detail-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .detail-top h2 { font-family: 'Poppins', sans-serif; font-weight: 700; color: var(--purple-dark); margin: 0; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { background: var(--panel2); border: 1px solid var(--border); font-size: 11.5px; padding: 3px 10px; border-radius: 12px; color: var(--purple); font-weight: 500; }
  .flagbig { font-size: 13px; font-weight: 700; padding: 7px 16px; border-radius: 8px; color: #fff; letter-spacing: .02em; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-top: 14px; box-shadow: 0 2px 10px rgba(61,26,120,0.06); }
  .panel h3 { margin: 0 0 10px; font-size: 12.5px; color: var(--purple); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 3px; display: inline-block; border-radius: 2px; }
  .note { font-size: 11.5px; color: var(--muted); margin-top: 12px; line-height: 1.6; }
  label.toggle { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .stat-row { display: flex; gap: 26px; margin-top: 6px; }
  .stat { font-size: 12px; color: var(--muted); }
  .stat b { color: var(--purple-dark); font-size: 17px; display: block; font-family: 'Poppins', sans-serif; }
  .empty-warning { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Rum — OSA Digital Twin: Clinician Dashboard (Concept)</h1>
  <p>Conceptual prototype. One held-out overnight recording paired with synthetic patient EHR profiles. Not a diagnostic device.</p>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

<script src="data.js"></script>
<script>
// --- safety check: catch a stale/empty data.js early with a clear message instead of a blank chart ---
if (typeof TIMELINE === 'undefined' || !TIMELINE.minute || TIMELINE.minute.length === 0 ||
    typeof PATIENTS === 'undefined' || PATIENTS.length === 0) {
  document.getElementById('main').innerHTML =
    '<div class="empty-warning"><h3>No data loaded</h3>' +
    '<p>dashboard/data.js is missing, empty, or stale.<br>' +
    'Run <code>python src/08_export_dashboard_data.py</code> again, then hard-refresh this page (Ctrl+Shift+R).</p></div>';
  throw new Error('TIMELINE/PATIENTS empty — stopping render.');
}

const FLAG_COLOR = { HIGH: '#d6305c', MODERATE: '#f0b429', LOW: '#3d1a78' };

function fuseAndFlag(staticPct) {
  const fused = TIMELINE.dynamic_prob.map(d => WEIGHTS.static * staticPct + WEIGHTS.dynamic * d);
  const flags = fused.map(v => v >= THRESHOLDS.high ? 'HIGH' : v >= THRESHOLDS.moderate ? 'MODERATE' : 'LOW');
  return { fused, flags };
}

function overallFlag(flags) {
  const share = f => flags.filter(x => x === f).length / flags.length;
  if (share('HIGH') > 0.25) return 'HIGH';
  if (share('HIGH') + share('MODERATE') > 0.4) return 'MODERATE';
  return 'LOW';
}

let selected = PATIENTS[0];
let showTruth = false;

function renderSidebar() {
  const el = document.getElementById('sidebar');
  el.innerHTML = PATIENTS.map(p => {
    const { flags } = fuseAndFlag(p.static_pct);
    const flag = overallFlag(flags);
    const active = p.id === selected.id ? 'active' : '';
    return `<div class="patient-card ${active}" data-id="${p.id}">
      <div class="pc-top"><span class="pc-id">Patient ${p.id}</span><span class="badge ${flag}">${flag}</span></div>
      <div class="pc-meta">${p.age ?? '—'}y · ${p.gender} · EHR risk percentile ${(p.static_pct*100).toFixed(0)}</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.patient-card').forEach(card => {
    card.onclick = () => { selected = PATIENTS.find(p => p.id === card.dataset.id); render(); };
  });
}

function drawChart(canvas, fused, flags) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, pad = { l: 42, r: 60, t: 14, b: 26 };
  ctx.clearRect(0, 0, W, H);
  const x0 = pad.l, x1 = W - pad.r, y0 = H - pad.b, y1 = pad.t;
  const xs = TIMELINE.minute, maxX = xs[xs.length - 1];
  const sx = m => x0 + (m / maxX) * (x1 - x0);
  const sy = v => y0 - Math.max(0, Math.min(1, v)) * (y0 - y1);

  if (showTruth) {
    ctx.fillStyle = 'rgba(214,48,92,0.14)';
    for (let i = 0; i < TIMELINE.event_truth.length - 1; i++) {
      if (TIMELINE.event_truth[i]) ctx.fillRect(sx(xs[i]), y1, sx(xs[i+1]) - sx(xs[i]), y0 - y1);
    }
  }

  // threshold lines — dashed, stop short of the right edge to leave room for labels
  [[THRESHOLDS.high, FLAG_COLOR.HIGH], [THRESHOLDS.moderate, FLAG_COLOR.MODERATE]].forEach(([v, c]) => {
    ctx.strokeStyle = c; ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, sy(v)); ctx.lineTo(x1, sy(v)); ctx.stroke();
    ctx.setLineDash([]);
  });

  // the risk line itself, drawn BEFORE the labels so labels always sit on top
  for (let i = 0; i < fused.length - 1; i++) {
    ctx.strokeStyle = FLAG_COLOR[flags[i]];
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(sx(xs[i]), sy(fused[i]));
    ctx.lineTo(sx(xs[i+1]), sy(fused[i+1]));
    ctx.stroke();
  }

  // axes
  ctx.strokeStyle = '#d8cdf0'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();
  ctx.fillStyle = '#716a8c'; ctx.font = '10px Inter, sans-serif';
  [0, 0.5, 1].forEach(v => ctx.fillText(v.toFixed(1), 6, sy(v) + 3));
  [0, Math.round(maxX/2), Math.round(maxX)].forEach(m => ctx.fillText(m + 'm', sx(m) - 8, y0 + 16));

  // threshold labels — placed in the clear margin to the right of the plotted line, with a solid background
  [[THRESHOLDS.high, FLAG_COLOR.HIGH, 'HIGH'], [THRESHOLDS.moderate, FLAG_COLOR.MODERATE, 'MODERATE']].forEach(([v, c, label]) => {
    const ly = sy(v);
    const lw = ctx.measureText(label).width + 10;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x1 + 4, ly - 9, lw, 14);
    ctx.fillStyle = c;
    ctx.font = 'bold 10px Inter, sans-serif';
    ctx.fillText(label, x1 + 8, ly + 2);
  });
}

function render() {
  renderSidebar();
  const { fused, flags } = fuseAndFlag(selected.static_pct);
  const flag = overallFlag(flags);
  const hiShare = (flags.filter(f => f === 'HIGH').length / flags.length * 100).toFixed(0);

  document.getElementById('main').innerHTML = `
    <div class="detail-top">
      <div>
        <h2>Patient ${selected.id}</h2>
        <div class="pc-meta">${selected.age ?? '—'} years old · ${selected.gender} · synthetic EHR profile</div>
        <div class="tags">${selected.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      </div>
      <span class="flagbig badge ${flag}">${flag} RISK TONIGHT</span>
    </div>

    <div class="stat-row">
      <div class="stat"><b>${(selected.static_pct*100).toFixed(0)}th pct</b>EHR risk cohort rank</div>
      <div class="stat"><b>${hiShare}%</b>of night flagged HIGH</div>
      <div class="stat"><b>${DEMO_RECORD}</b>demo recording (held out from training)</div>
    </div>

    <div class="panel">
      <h3>Overnight Fused Risk</h3>
      <canvas id="chart" width="900" height="260" style="width:100%;height:260px"></canvas>
      <div class="legend">
        <span><span class="swatch" style="background:${FLAG_COLOR.LOW}"></span>LOW</span>
        <span><span class="swatch" style="background:${FLAG_COLOR.MODERATE}"></span>MODERATE</span>
        <span><span class="swatch" style="background:${FLAG_COLOR.HIGH}"></span>HIGH</span>
        <label class="toggle"><input type="checkbox" id="truthToggle" ${showTruth ? 'checked' : ''}> show retrospective expert annotations</label>
      </div>
      <div class="note">
        Fused risk = ${WEIGHTS.static} × static EHR risk + ${WEIGHTS.dynamic} × dynamic signal risk (same physiological
        recording for every patient shown here — only the static EHR profile changes). Thresholds and weights are
        hand-set for this prototype, not clinically calibrated. Annotations are shown only for validation; a deployed
        system would not have ground truth in real time.
      </div>
    </div>
  `;
  drawChart(document.getElementById('chart'), fused, flags);
  document.getElementById('truthToggle').onchange = e => { showTruth = e.target.checked; render(); };
}

render();
</script>
</body>
</html>
